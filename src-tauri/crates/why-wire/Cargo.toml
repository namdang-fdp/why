[package]
name = "why-wire"
version = "0.2.1"
description = "Wire protocol shared by why-hook and the WHY app: envelope, framing, instance paths"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# Deliberately tiny: this crate is linked into `why-hook`, which starts once per
# agent event, so every dependency here is paid for in hook start-up time.
# No tauri, no tokio.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# `flock` for the spool protocol (see `spool.rs`). Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
