[package]
name = "why"
version = "0.1.0"
description = "WHY: review agent-written code with the reasons attached"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

# A Cargo workspace rooted at the app package. The root stays the `why` app (so
# `Cargo.lock` and `target/` stay in `src-tauri/`, where CI, the release workflow
# and `scripts/check-versions.mjs` expect them); the members are small crates that
# share that lockfile and build directory:
#   - `why-wire`: the wire protocol shared by the hook and the app,
#   - `why-hook`: the fail-open binary the agents' hooks run.
# Profiles (below) are workspace-wide: Cargo ignores `[profile]` in members.
[workspace]
members = ["crates/why-wire", "crates/why-hook"]

# Named `why_lib` (not `why`) so the library and the binary don't clash on Windows.
[lib]
name = "why_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The hook <-> app protocol (envelope, framing, socket/spool paths).
why-wire = { path = "crates/why-wire" }
tauri = { version = "2.12", features = [] }
# Async runtime for the later git/watch/store work. Only the features we use.
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Codex's managed hook policy lives in requirements.toml.
toml = "1"
# Exclusively created staging files for hook binaries and settings.
tempfile = "3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Stable, well-known hash for worktree ids (std's DefaultHasher is explicitly not
# stable across Rust releases). Already in the dependency tree via Tauri.
sha2 = "0.11"
# `join_all`: run the per-worktree git work concurrently without spawning tasks
# (so the futures may borrow `AppState`). Already in the tree through Tauri.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# RFC 3339 timestamps for the session contracts (they cannot carry a u64 of
# milliseconds, see `contracts/sessions.rs`). Already in the tree through Tauri;
# no clock or timezone features, only formatting.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# SQLite for the repository store. `bundled` compiles SQLite into the binary, so
# the app does not depend on (or vary with) the system's libsqlite3.
rusqlite = { version = "0.43", features = ["bundled"] }
# Cross-platform filesystem events (inotify on Linux, FSEvents on macOS).
notify = "8.2"
# ripgrep's gitignore matcher, so the watcher skips node_modules/, target/, ...
ignore = "0.4"
# Native folder picker, driven from the Rust core only (see `ipc/dialog.rs`):
# the webview is granted no `dialog:*` permission.
tauri-plugin-dialog = "2.8"

# `O_NOFOLLOW` / `O_NONBLOCK` / `ELOOP` for opening worktree files safely (the
# raw flag values differ per OS and CPU, so they must come from libc). Already in
# the dependency tree through tokio and Tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test-only: generates the TypeScript types in ui/src/contracts from the contract
# types (`#[cfg_attr(test, derive(TS))]`), so it never ships in the app binary.
ts-rs = "12.0.1"
# `test-util` adds the paused clock (`tokio::time::pause`/`advance`) for the
# debounce tests; `macros` + `rt` give `#[tokio::test]`. Test-only, never shipped.
tokio = { version = "1.54", features = ["test-util", "macros", "rt"] }

# Dev builds: keep our code fast to compile, but optimise dependencies so the
# app stays responsive while developing.
[profile.dev.package."*"]
opt-level = 2

# Release builds: smaller, faster binary at the cost of longer compile times.
# NEVER add `panic = "abort"` here: this profile also builds `why-hook`, whose
# "always exit 0, print nothing" guarantee relies on `catch_unwind`, which only
# works with the default `panic = "unwind"`.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
