name: Bug report
description: Something in WHY does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        WHY is early software, so some things are expected to be missing. Please check the
        README status section first. **Security problems: do not file here**, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps or git commands that triggers it.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WHY version or commit
      description: A release tag, or the output of `git rev-parse --short HEAD` if you built from source.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Arch Linux, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything from the terminal where you ran `pnpm dev`. Remove private paths or code first.
      render: shell
