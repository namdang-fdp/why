# Release workflow. Two ways to run it:
#
#   * Push a tag starting with "v" (for example v0.1.0): builds the Linux bundles, creates a *draft*
#     GitHub release whose body is the matching CHANGELOG.md section, and attaches the bundles plus
#     a SHA256SUMS file. Nothing is public until the maintainer clicks "Publish release".
#   * "Run workflow" on the Actions tab (workflow_dispatch): a dry run. It builds the same bundles
#     and uploads them as workflow artifacts. It never creates a tag, a release or a release asset,
#     so the pipeline can be tested without publishing anything.
#
# The steps to follow around it are in docs/release-checklist.md.
# Linux only for now: AppImage and .deb.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. Only the jobs that attach files to the draft release get write access.
permissions:
  contents: read

# Never run two releases for the same ref at once, and never cancel one half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux bundles
    # An older Ubuntu keeps the AppImage compatible with more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.tauri-release.outputs.releaseId }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can check that the tag is on main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Cheap checks first, so a mistake fails in seconds and not after a 30 minute build.
      - name: Check that all version strings agree
        if: github.event_name == 'push'
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"

      - name: Check that all version strings agree (dry run)
        if: github.event_name != 'push'
        run: node scripts/check-versions.mjs

      - name: Check that the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main. Merge first, then tag main."
            exit 1
          fi

      - name: Read the version
        id: meta
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG.md section of this version. On a tag the script runs in
      # --strict mode: it refuses a missing section, a leftover date placeholder or a TODO.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/release-notes.mjs "$VERSION" --strict > release-notes.md
          else
            node scripts/release-notes.mjs "$VERSION" > release-notes.md
          fi
          {
            echo
            echo "---"
            echo
            echo "Install and verify: see the [README](https://github.com/$GITHUB_REPOSITORY#install)."
            echo "Check a download with \`sha256sum --check --ignore-missing SHA256SUMS\`."
          } >> release-notes.md
          {
            echo 'body<<WHY_RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'WHY_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release notes for $VERSION"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # `why-hook` is the tiny binary agents run for every hook event. It ships next to the app as a
      # Tauri sidecar (`bundle.externalBin`). The script builds it and stages it as
      # src-tauri/binaries/why-hook-<target-triple>; the same script is behind `pnpm build`, so local and
      # CI bundles are identical. `externalBin` is declared only in src-tauri/tauri.bundle-hook.conf.json
      # (passed with --config below), NOT in tauri.conf.json: tauri-build refuses to compile the app
      # when a declared sidecar is missing, which would break every plain `cargo build`/`cargo test`.
      - name: Build why-hook and stage it as the Tauri sidecar
        run: node scripts/stage-hook.mjs

      # Tag push: build, create the DRAFT release (not a pre-release) and upload the bundles.
      - name: Build and create the draft release
        id: tauri-release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          # tauri.conf.json says "targets": "all"; only build what we mean to ship.
          args: --bundles appimage,deb --config src-tauri/tauri.bundle-hook.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: WHY ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Draft: the maintainer verifies the assets and publishes by hand.
          releaseDraft: true
          prerelease: false
          # No updater is configured, so there is no latest.json and there are no .sig files.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      # Manual run: build only. Leaving out tagName, releaseName and releaseId tells the action
      # not to touch GitHub releases.
      - name: Build (dry run, no release)
        if: github.event_name != 'push'
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: pnpm tauri
          args: --bundles appimage,deb --config src-tauri/tauri.bundle-hook.conf.json

      # tauri-action keeps the file names Tauri gives the bundles: <productName>_<version>_<arch>.
      # Fail loudly if that ever changes, because the README, the checklist and the checksum job
      # all rely on these names.
      # The bundles are also copied into one flat folder, dist/. upload-artifact roots an artifact
      # at the common parent of its paths, so uploading the two bundle folders directly would keep
      # the appimage/ and deb/ subfolders and break the checksum job below.
      - name: Check the bundle names and collect them in dist/
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bundle=src-tauri/target/release/bundle
          ls -lh "$bundle/appimage" "$bundle/deb"
          mkdir dist
          for f in "$bundle/appimage/WHY_${VERSION}_amd64.AppImage" "$bundle/deb/WHY_${VERSION}_amd64.deb"; do
            test -f "$f" || { echo "::error::expected bundle $f was not produced"; exit 1; }
            cp -- "$f" dist/
          done
          ls -l dist

      # Always keep the bundles as workflow artifacts too: this is the result of a dry run, and on a
      # real release it is what the checksum job reads and what you can fall back to.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: dist
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundles
          path: bundles

      - name: Compute SHA256SUMS
        run: |
          # Bare file names in SHA256SUMS, so users can run `sha256sum --check` next to the downloads.
          cd bundles
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2 || { echo "::error::expected exactly an AppImage and a .deb"; find . -ls; exit 1; }
          sha256sum -- * | tee ../SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # Tag push only. Download what is really attached to the draft, check it against the sums
      # (catches a truncated upload) and then attach SHA256SUMS to the same draft. The draft is
      # addressed by its id: a draft release cannot be looked up by tag name.
      - name: Verify the draft assets and attach SHA256SUMS
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-linux.outputs.release-id }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::the build job did not report a release id"
            exit 1
          fi
          api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"

          gh api "$api" --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.id)\t\(.name)"' > assets.tsv
          mkdir published
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "published/$name"
          done < assets.tsv

          # The draft must hold exactly the files we built: no more, no fewer.
          diff <(ls published | sort) <(ls bundles | sort)
          (cd published && sha256sum --check ../SHA256SUMS)

          # Re-running this job must not fail on an existing SHA256SUMS.
          old=$(gh api "$api" --jq '.assets[] | select(.name == "SHA256SUMS") | .id')
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS" > /dev/null
          echo "Attached SHA256SUMS to draft release $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
